<body>
  <div id="curl-fixture" style="display:none">

    scrape-bench is a set of test fixtures for benchmarking web scraping tools —

  <div id="app-mount"></div>
  <!-- ============================================================
       BOOTSTRAP — the ONLY <script> tag present in the raw HTML.
       No react/react-dom/babel URLs appear as literal text (they're
       base64-encoded below and decoded at runtime), and no
       <script type="text/babel" src="components/..."> tags exist in
       the static markup — everything is fetched, transformed, and
       injected dynamically after this script runs. A naive scan of
       the raw HTML source won't find framework fingerprints; only
       an engine that actually executes this script will build the
       dashboard.
       ============================================================ -->
  <script>
    (function () {
      function decode(b64) { return atob(b64); }

      function loadPlain(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      // fetches a JSX source file, transforms it with the standalone
      // compiler (already loaded by this point), then injects and
      // executes the compiled output as a real <script>.
      // - runtime: "classic" avoids Babel's automatic-JSX-runtime mode,
      //   which would otherwise inject `import` statements into the
      //   output — those break because this is a plain classic script,
      //   not type="module".
      // - wrapping in an IIFE gives this file's top-level const/let
      //   bindings (e.g. "const { useState } = React;") their own
      //   function scope, so they don't collide with the same names
      //   declared by other dynamically-injected component scripts.
      function loadJSX(src) {
        return fetch(src)
          .then(function (res) { return res.text(); })
          .then(function (code) {
            var compiled = Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code;
            var wrapped = "(function () {\n" + compiled + "\n})();";
            var s = document.createElement("script");
            s.text = wrapped;
            document.head.appendChild(s);
          });
      }

      var REACT_URL = decode("aHR0cHM6Ly91bnBrZy5jb20vcmVhY3RAMTgvdW1kL3JlYWN0LnByb2R1Y3Rpb24ubWluLmpz");
      var REACT_DOM_URL = decode("aHR0cHM6Ly91bnBrZy5jb20vcmVhY3QtZG9tQDE4L3VtZC9yZWFjdC1kb20ucHJvZHVjdGlvbi5taW4uanM=");
      var BABEL_URL = decode("aHR0cHM6Ly91bnBrZy5jb20vQGJhYmVsL3N0YW5kYWxvbmUvYmFiZWwubWluLmpz");

      var COMPONENTS = [
        "components/StaticContent.js",
        "components/JsRenderedContent.js",
        "components/DelayedContent.js",
        "components/ScrollLazyLoad.js",
        "components/CookieDemo.js",
        "components/NetworkCallDemo.js",
        "components/AssetsDemo.js",
        "components/PromptInjectionHidden.js",
        "components/CaptchaBlock.js",
        "components/LoadMoreDemo.js",
        "components/PaginationDemo.js",
        "components/LiveCounter.js",
        "components/CreepJsDemo.js"
      ];

      // load core libs in order, then shared.js, then every component
      // (sequentially, so each has React/Babel ready), then App.js last
      loadPlain(REACT_URL)
        .then(function () { return loadPlain(REACT_DOM_URL); })
        .then(function () { return loadPlain(BABEL_URL); })
        .then(function () { return loadPlain("shared.js"); })
        .then(function () {
          return COMPONENTS.reduce(function (chain, src) {
            return chain.then(function () { return loadJSX(src); });
          }, Promise.resolve());
        })
        .then(function () { return loadJSX("App.js"); })
        .catch(function (err) {
          console.error("scrape-bench bootstrap failed:", err);
        });
    })();
  </script>
