<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>scrape-bench · latihan_1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="curl-fixture" style="display:none">
    <div class="product" data-name="iPhone 17 128GB" data-price="$999"></div>
    <div class="product" data-name="iPhone 17 Pro 256GB" data-price="$1,299"></div>
    <div class="product" data-name="iPhone 17 Pro Max 512GB" data-price="$1,599"></div>
  </div>

  <noscript>
    <p>This page requires JavaScript to display the scrape-bench test dashboard.</p>
  </noscript>
  <p id="static-note" style="max-width:640px;margin:60px auto;padding:0 20px;color:#6E7681;font-family:sans-serif;font-size:14px;line-height:1.6;">
    scrape-bench is a set of test fixtures for benchmarking web scraping tools —
    covering static HTML, delayed content, cookies, network calls, anti-bot walls,
    pagination, and more. The interactive dashboard below is built and populated
    entirely at runtime.
  </p>

  <!-- app mount point — deliberately NOT named "root" and not left
       conspicuously empty next to obvious framework <script> tags -->
  <div id="app-mount"></div>
  <script>
    (function () {
      function decode(b64) { return atob(b64); }

      function loadPlain(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }

      function loadJSX(src) {
        return fetch(src)
          .then(function (res) { return res.text(); })
          .then(function (code) {
            var compiled = Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code;
            var wrapped = "(function () {\n" + compiled + "\n})();";
            var s = document.createElement("script");
            s.text = wrapped;
            document.head.appendChild(s);
          });
      }

      var REACT_URL = decode("aHR0cHM6Ly91bnBrZy5jb20vcmVhY3RAMTgvdW1kL3JlYWN0LnByb2R1Y3Rpb24ubWluLmpz");
      var REACT_DOM_URL = decode("aHR0cHM6Ly91bnBrZy5jb20vcmVhY3QtZG9tQDE4L3VtZC9yZWFjdC1kb20ucHJvZHVjdGlvbi5taW4uanM=");
      var BABEL_URL = decode("aHR0cHM6Ly91bnBrZy5jb20vQGJhYmVsL3N0YW5kYWxvbmUvYmFiZWwubWluLmpz");

      var COMPONENTS = [
    "components/StaticContent.js",
    "components/JsRenderedContent.js",
    "components/DelayedContent.js",
    "components/CreepJsDemo.js",
    "components/CookieDemo.js",
    "components/NetworkCallDemo.js",
    "components/AssetsDemo.js",
    "components/PromptInjectionHidden.js",
    "components/LiveCounter.js",
    "components/CaptchaBlock.js",
    "components/ScrollLazyLoad.js"
      ];
      // load core libs in order, then shared.js, then every component
      // (sequentially, so each has React/Babel ready), then App.js last
      loadPlain(REACT_URL)
        .then(function () { return loadPlain(REACT_DOM_URL); })
        .then(function () { return loadPlain(BABEL_URL); })
        .then(function () { return loadPlain("shared.js"); })
        .then(function () {
          return COMPONENTS.reduce(function (chain, src) {
            return chain.then(function () { return loadJSX(src); });
          }, Promise.resolve());
        })
        .then(function () { return loadJSX("App.js"); })
        .catch(function (err) {
          console.error("scrape-bench bootstrap failed:", err);
        });
    })();
  </script>

</body>
</html>
